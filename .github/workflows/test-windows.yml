name: test-windows

on: [push, workflow_dispatch]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        luaVersion: ["5.4", "5.5"]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - shell: cmd
      run: git config --global core.autocrlf input

    - uses: actions/checkout@master

    - uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        pacboy: >-
          binutils:
          patch:
          zip:
          unzip:
          cc:p
          libltdl:p
          libtool:p
          pkgconf:p
          autotools:p
          cairo:p
    
    - name: setup-lua-luarocks 
      shell: msys2 {0}
      run: |
        uname -a
        pwd
        echo "-----------------------------------------------------------"
        # MSYS2's default "lua" package is Lua 5.5; older versions are
        # packaged as lua54, lua53, ... with versioned file names and need
        # a manual luarocks setup (there are no luaXY-luarocks packages)
        V="${{ matrix.luaVersion }}"
        if [ "$V" = "5.5" ]; then
          pacboy --noconfirm -Sy lua:p lua-luarocks:p
        else
          pacboy --noconfirm -Sy "lua${V/./}:p" lua-luarocks:p
          echo "-----------------------------------------------------------"
          luarocks config lua_version "$V"
          luarocks config variables.LUA "/mingw64/bin/lua$V.exe"
          luarocks config variables.LUA_INCDIR "/mingw64/include/lua$V"
          luarocks config variables.LUA_LIBDIR /mingw64/bin
          luarocks config variables.LUALIB "lua${V/./}.dll"
          # let plain "lua" invoke the requested version in later steps
          cp -f "/mingw64/bin/lua$V.exe" /mingw64/bin/lua.exe
        fi
        echo "-----------------------------------------------------------"
        type lua
        type luarocks
        echo "-----------------------------------------------------------"
        lua -v
        echo "-----------------------------------------------------------"
        luarocks --version
        luarocks config | head -60
        echo "-----------------------------------------------------------"
        luarocks install luafilesystem

    - name: setup-lwtk 
      shell: msys2 {0}
      run: |
        luarocks install lpath
        luarocks install oocairo
        luarocks install luautf8
        luarocks --server=https://luarocks.org/dev install lpugl
        luarocks --server=https://luarocks.org/dev install lpugl_cairo
        luarocks --server=https://luarocks.org/dev install lpugl_opengl
        echo "-----------------------------------------------------------"
        luarocks make lwtk-scm-0.rockspec
        echo "-----------------------------------------------------------"
        
    - name: alltests 
      shell: msys2 {0}
      run: |
        set -e
        lua -v
        echo "-----------------------------------------------------------"
        lua src/alltests.lua src/tests
        echo "-----------------------------------------------------------"

    - name: doctest 
      shell: msys2 {0}
      run: |
        set -e
        lua -v
        cd src
        lua -e 'print("package.path=", package.path)'
        export LUA_PATH='.\?.lua;.\?\init.lua;'"$(lua -e 'print(package.path)')"
        echo "LUA_PATH=$LUA_PATH"
        lua -e 'print("package.path=", package.path)'
        echo "-----------------------------------------------------------"
        lua doctest.lua 
        echo "-----------------------------------------------------------"
     