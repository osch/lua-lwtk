name: test-windows

on: [push, workflow_dispatch]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        luaVersion: ["5.4"]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - shell: cmd
      run: git config --global core.autocrlf input

    - uses: actions/checkout@master

    - uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        pacboy: >-
          binutils:
          patch:
          zip:
          unzip:
          cc:p
          libltdl:p
          libtool:p
          pkgconf:p
          autotools:p
          cairo:p
    
    - name: setup-lua-luarocks 
      shell: msys2 {0}
      run: |
        uname -a
        pwd
        echo "-----------------------------------------------------------"
        # MSYS2's default "lua" package is Lua 5.5 now, but the rockspecs
        # require lua <= 5.4: install lua54 and switch luarocks to it
        # (there is no separate lua54-luarocks package)
        pacboy --noconfirm -Sy lua54:p lua-luarocks:p
        echo "-----------------------------------------------------------"
        luarocks config lua_version 5.4
        luarocks config variables.LUA /mingw64/bin/lua5.4.exe
        luarocks config variables.LUA_INCDIR /mingw64/include/lua5.4
        luarocks config variables.LUA_LIBDIR /mingw64/bin
        luarocks config variables.LUALIB lua54.dll
        # let plain "lua" invoke lua 5.4 in the following steps
        cp -f /mingw64/bin/lua5.4.exe /mingw64/bin/lua.exe
        echo "-----------------------------------------------------------"
        type lua
        type luarocks
        echo "-----------------------------------------------------------"
        lua -v
        echo "-----------------------------------------------------------"
        luarocks --version
        luarocks config | head -60
        echo "-----------------------------------------------------------"
        luarocks install luafilesystem

    - name: setup-lwtk 
      shell: msys2 {0}
      run: |
        luarocks install lpath
        luarocks install oocairo
        luarocks install https://luarocks.org/manifests/xavier-wang/luautf8-0.1.5-2.rockspec
        luarocks --server=https://luarocks.org/dev install lpugl
        luarocks --server=https://luarocks.org/dev install lpugl_cairo
        luarocks --server=https://luarocks.org/dev install lpugl_opengl
        echo "-----------------------------------------------------------"
        luarocks make lwtk-scm-0.rockspec
        echo "-----------------------------------------------------------"
        
    - name: alltests 
      shell: msys2 {0}
      run: |
        set -e
        lua -v
        echo "-----------------------------------------------------------"
        lua src/alltests.lua src/tests
        echo "-----------------------------------------------------------"

    - name: doctest 
      shell: msys2 {0}
      run: |
        set -e
        lua -v
        cd src
        lua -e 'print("package.path=", package.path)'
        export LUA_PATH='.\?.lua;.\?\init.lua;'"$(lua -e 'print(package.path)')"
        echo "LUA_PATH=$LUA_PATH"
        lua -e 'print("package.path=", package.path)'
        echo "-----------------------------------------------------------"
        lua doctest.lua 
        echo "-----------------------------------------------------------"
     